[package]
name = "cubetimer"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Full-screen speedcube timer for the terminal: WCA inspection, hold-to-start, random-state scrambles with preview"
license = "MIT"
repository = "https://github.com/thomasmartinoa/cubetimer"
readme = "README.md"
keywords = ["speedcubing", "rubiks-cube", "timer", "tui", "terminal"]
categories = ["command-line-utilities", "games"]

[dependencies]
dirs = "7.0.0"
image = { version = "0.25", default-features = false, features = ["png"] }
rand = "0.10.3"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
rustix = { version = "0.38.44", features = ["event"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.3.18"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The scramble solver's tables take seconds to build unoptimized; tests (and
# makepkg's check()) are much faster with optimizations on.
[profile.test]
opt-level = 3

[profile.dev]
opt-level = 1
